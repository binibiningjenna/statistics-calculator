<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statistics Calculator</title>
    <link rel="icon" href="https://cdn2.iconfinder.com/data/icons/business-272/64/STATISTICS-1024.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      .form-control:focus {
        box-shadow: none;
      }
    </style>
  </head>
  <body data-bs-theme="dark">
    <div class="container mt-5" style="place-items: center">
      <h2 class="text-center mb-4">Statistics Calculator</h2>

      <div class="col-12 col-md-6 card shadow">
        <div class="card-body">
          <form id="statsForm">
            <div class="mb-3">
              <label for="numbersInput" class="form-label">Enter numbers (comma-separated)</label>
              <input type="text" class="form-control" id="numbersInput" placeholder="e.g. 1, 2, 3, 4, 5" />
            </div>
            <button type="submit" class="btn btn-primary w-100">Calculate</button>
          </form>
        </div>
      </div>

      <div class="col-12 col-md-6 card shadow mt-4 d-none" id="resultsCard">
        <div class="card-body">
          <h4 class="card-title">Results:</h4>
          <ul class="list-group" id="resultsList"></ul>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
